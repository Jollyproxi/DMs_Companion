name: Build release packages

on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").removesuffix("\n")
          number = r"(?:0|[1-9][0-9]*)"
          if not re.fullmatch(rf"v{number}\.{number}\.{number}", version):
              raise SystemExit("VERSION must contain one version such as v1.2.3")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={version}", file=output)
      - name: Check that the release tag is available
        if: github.base_ref == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/release')
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $TAG already exists. Update VERSION before promoting main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync_agents.py --check
      - run: python scripts/build_packages.py dist
      - run: |
          for archive in dist/*.zip; do unzip -tq "$archive"; done
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Publish ZIP files for the promoted commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: gh release create "$TAG" --title "$TAG" --target "$COMMIT" --generate-notes dist/*.zip
